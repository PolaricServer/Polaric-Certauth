# Base URL of the Polaric-Certauth service
service_url = https://localhost:7077

# Service paths
sign_path = /cacert/sign

# Input and output files
csr_file = request.csr
cert_file = certificate.pem

# Authentication identity
userid = device1

# Authentication secret
# shared_secret: static service/device secret from the server key file
shared_secret = replace-with-shared-secret

# Optional authorization role and certificate validity
# role = operator
# days = 365

# TLS options
# ca_file = /path/to/ca.pem
# insecure_tls = false
