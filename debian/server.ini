# Default server configuration for the Debian package.
# Review and update these paths and secrets before running the service.

httpserver.alloworigin = .*
httpserver.userfile = /etc/polaric-certauth/users.dat
httpserver.groupfile = /etc/polaric-certauth/groups
httpserver.passwdfile = /etc/polaric-certauth/passwd
httpserver.keyfile = /etc/polaric-certauth/peers
httpserver.loginkeyfile = /etc/polaric-certauth/logins.dat
cacert.keystore = /var/lib/polaric-certauth/polaric-ca.p12
cacert.alias = polaric-root-ca

# Password for the keystore
cacert.keystore.pw = xxxxxxx

# Set your issuer DN here
cacert.issuer = CN=My Root CA

# Logging of certificate signing
cacert.log.file = /var/log/polaric-certauth/ca.log
cacert.log.on = true
