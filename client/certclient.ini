# Base URL of the Polaric-Certauth service
service_url = https://localhost:7077

# Service paths
sign_path = /cacert/sign
login_path = /directLogin

# Input and output files
csr_file = request.csr
cert_file = certificate.pem

# Authentication identity
userid = device1

# Choose one authentication mechanism:
# 1) password: log in first and get a temporary session key
# password = changeme
#
# 2) session_key: already obtained base64-encoded session key
# session_key = BASE64_SESSION_KEY
#
# 3) shared_secret: static service/device secret from the server key file
shared_secret = replace-with-shared-secret

# Optional role and certificate validity
# role = operator
# days = 365

# TLS options
# ca_file = /path/to/ca.pem
# insecure_tls = false
